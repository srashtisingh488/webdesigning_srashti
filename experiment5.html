<!DOCTYPE html>
<html lang="en">
<head>
    <title>Types of CSS</title>
    <!-- Internal CSS -->
     <style>
        body{
            background-color: lightgray;
            font-family: Arial;
            color: red;
        }
        h1{
            color: darkblue;
            text-align: center;
        }
        .internal{
            color: green;
            font-size: 20px;
        }
     </style>
     <!-- External CSS -->
      <link rel="stylesheet" href="external.css">
</head>
<body>
    <h1>Types of CSS</h1>
    <!-- Inline CSS -->
    <p style="color: purple; font-size: 20px;">
        This paragraph uses inline CSS</p>
    <!-- Internal CSS -->
         <p class="internal">
        This paragraph uses internal CSS</p>
    <!-- External CSS -->
         <div class="internal">
        This paragraph uses external CSS</div>    

</body>
</html>
