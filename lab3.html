<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <h1><font color="blue"> Differnt types of Lists </font></h1>
    <h2>Ordered List</h2>
    <ol type="a">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Bootstrap</li>
    </ol>
    <h2>Unordered List</h2>
    <ul type="square">
        <li>C</li>
        <li>C++</li>
        <li>Java</li>
        <li>Python</li>
    </ul>
    <h2>Nested List</h2>
    <ol>
        <li>Web Development
        <ul type="circle">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
        </li>

        <li>Programming
            <ul >
                <li>C++</li>
                <li>Java</li>
                <li>Python</li>
            </ul>
        </li>
    </ol>
    
</body>
</html>
