<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body style="background-color: rgb(218, 185, 191);">
    <form>
        <table align="center" >
        <tr>
        <td colspan="2">
        <table align="center" border="0">
        <tr>
        <td>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3ugai46WkbFDqIzLprdXZAE_o_f-3UxqZwUruEgqDCVkwmfDdFSYgseFZ&s=10"
         width="70">
        </td>
        <td>
        <h1>Registration Form</h1>
        </td>
        </tr>
        </table>
        </td>
        </tr>
        <tr>
        <td colspan="2">
        <fieldset>
        <legend><b>Personal Information</b></legend>
        <br>
        <label>Full Name :</label>
        <input type="text" placeholder="Enter your name" required>
        <br><br>
        <label>Email :</label>
        <input type="email" placeholder="Enter your email" required>
        <br><br>
        <label>Mob No. :</label>
        <input type="tel" placeholder="Enter your phone number" required>
        <br><br>
        <label>D.O.B :</label>
        <input type="date" required>
        <br><br>
        <label>Gender :</label>
        <input type="radio" name="gender">
        <label>Male</label>
        <input type="radio" name="gender">
        <label>Female</label>
        <input type="radio" name="gender">
        <label>Others</label>
        </fieldset>
        </td>
        </tr>
        <tr>
        <td colspan="2">
        <fieldset>
        <legend><b>Educational Information</b></legend>
        <br>
        <label>Course :</label>
        <select required>
        <option value="">Select your course</option>
        <option>BCA</option>
        <option>B.Tech</option>
        <option>MCA</option>
        <option>BBA</option>
        <option>MBA</option>
        </select>
        <br><br>
        <label>Hobbies :</label>
        <input type="checkbox">
        <label>Reading</label>
        <input type="checkbox">
        <label>Coding</label>
        <input type="checkbox">
        <label>Music</label>
        <input type="checkbox">
        <label>Travelling</label>
        </fieldset>
        </td>
        </tr>
        <tr>
        <td colspan="2">
        <fieldset>
        <legend><b>Contact Information</b></legend>
        <br>
        <label>Address :</label>
        <br>
        <textarea rows="4" cols="50" placeholder="Enter your address"></textarea>
        <br><br>
        <label>Profile Picture :</label>
        <input type="file">
        </fieldset>
        </td>
        </tr>
        <tr>
        <td colspan="2">
        <fieldset>
        <legend><b>Account Information</b></legend>
        <br>
        <label>Password :</label>
        <input type="password" placeholder="Enter your password" required>
        <br><br>
        <label>Confirm Password :</label>
        <input type="password" placeholder="Re-enter your password" required>
        <br><br>
        <input type="checkbox" required>
        <label>I agree to the Terms and Conditions</label>
        </fieldset>
        </td>
        </tr>
        <tr>
        <td colspan="2" align="center">
        <input type="submit" value="Register">
        &nbsp;&nbsp;
        <input type="reset" value="Reset">
        </td>
        </tr>
        </table>
    </form>
</body>
</html>
