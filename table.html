<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            width: 60%;
            height: 40lvh;
            margin:auto;
            border: 3px solid black;
            border-spacing: 1px;
            border-radius: 10px;
            font-size: 25px;
            border-style: solid;
        }
        th, td {
            padding: 15px;
            border: 3px solid black;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1 align="center">Table using HTML</h1>
    <table>
        <tr style="background-color: bisque;">
            <th>First Name:</th>
            <th>Last Name:</th>
            <th>Age:</th>
        </tr>
        <tr>
            <td align="center">Jill</td>
            <td align="center">Smith</td>
            <td align="center">50</td>
        </tr>
        <tr>
            <td align="center">Eve</td>
            <td align="center">Jackson</td>
            <td align="center">94</td>
        </tr>
    </table>
</body>
</html>
