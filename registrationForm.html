<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Registration Form</title>
    </head>
    <body style="background-color:rgb(228, 189, 195);">
        <form align="center">
            <p>
                <img align="left" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3ugai46WkbFDqIzLprdXZAE_o_f-3UxqZwUruEgqDCVkwmfDdFSYgseFZ&s=10">
                <h1 align="center" style="color: black;"><b>Registration Form</b></h1></p>
            <h3><label>Full Name :</label>
            <input type="text" placeholder="Enter your name">
            <h3><label>Email :</label>
            <input type="email" placeholder="Enter your email">
            <h3><label>Mob no. :</label>
            <input type="tel" placeholder="Enter your phone number">
            <h3><label>Course :</label>
            <select>
            <option>Enter your course</option>
            <option>bca</option>
            <option>btech</option>
            <option>mca</option>
            <option>bba</option>
            <option>mba</option>
            </select>
            <h3><label>D.O.B :</label>
            <input type="date" placeholder="Enter your date of birth">
            <h3>Gender:
                <input type="radio" name="gender">male
                <input type="radio" name="gender">female
                <input type="radio" name="gender">others
            </h3>
            <h3><label>Address :</label>
            <input type="text area" placeholder="Enter your address"></h3>
            <input type="submit">
        </form>
    </body> 
</html>
