<!doctype html>
<html>
<head>
<title>lists</title>
</head>
<body>
    <ul>
        <h1>programming languages</h1>
        <li>java</li>
        <li>python</li>
    </ul>
    <ol type="1" start="1">
        <h1>backend languages:</h1>
        <li>python</li>
        <li>java</li>
    </ol>
    <dl>
        <dt>html</dt>
        <dd>hypertext markup language</dd>
        <dt>css</dt>
        <dd>cascading style sheet</dd>
    </dl>
</body>
</html>
